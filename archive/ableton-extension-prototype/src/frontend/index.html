<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Pack Visual Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0d0e;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #top-bar {
      height: 48px;
      background: rgba(20, 22, 25, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #00ffcc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(0, 255, 204, 0.12);
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 4px;
      color: #00ffcc;
    }
    #status-indicator {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffaa00;
      box-shadow: 0 0 8px #ffaa00;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.connected {
      background: #00ffaa;
      box-shadow: 0 0 8px #00ffaa;
    }
    #main-layout {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #sidebar-pane {
      width: 240px;
      background: #121417;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      z-index: 5;
    }
    .sidebar-header {
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    #tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-size: 12px;
      color: #aaa;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 40%, #171a20 0%, #0c0d0e 80%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #coverflow-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #hud-overlay {
      position: absolute;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(18, 20, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .action-btn {
      background: #00ffcc;
      color: #0c0d0e;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .action-btn:hover {
      background: #33ffdd;
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div class="brand-title">
        <span>⚡ Sample Pack Visual Browser</span>
        <span class="brand-badge">Live 12</span>
      </div>
      <div id="status-indicator">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text" style="color: #ffaa00;">Initializing Host IPC Bridge...</span>
      </div>
    </header>

    <main id="main-layout">
      <aside id="sidebar-pane">
        <div class="sidebar-header">Sample Packs</div>
        <div id="tree-container">
          <div style="padding: 12px; text-align: center; color: #666; font-size: 11px;">
            No directory scanned yet.<br>Click "Scan Directory" to index packs.
          </div>
        </div>
      </aside>

      <section id="viewport-container">
        <canvas id="coverflow-canvas"></canvas>

        <div id="hud-overlay">
          <div class="hud-card">
            <span id="hud-pack-title" style="font-weight: 600; font-size: 13px;">[Phase 1 Ready: IPC Handshake Active]</span>
            <button id="btn-ping" class="action-btn">Send Test PING</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
